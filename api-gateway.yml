server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: iam-service-route
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
        - id: driver-service-route
          uri: lb://driver-service
          predicates:
            - Path=/api/v1/drivers/**, /api/v1/vehicles/**
        - id: location-service-route
          uri: lb://location-service
          predicates:
            - Path=/api/v1/locations/**, /ws/**
        - id: pricing-service-route
          uri: lb://pricing-service
          predicates:
            - Path=/api/v1/pricing/**
        - id: trip-service-route
          uri: lb://trip-service
          predicates:
            - Path=/api/v1/trips/**
        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**, /api/v1/wallets/**
