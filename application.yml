# ==============================================================================
# GLOBAL SHARED CONFIGURATION (Inherited by all microservices)
# Ride-Hailing & Logistics Platform
# ==============================================================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    root: INFO
    com.ridehailing.logistics: DEBUG
    org.springframework.web: INFO
