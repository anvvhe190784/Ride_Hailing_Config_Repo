server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/location_db?currentSchema=location
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: location
        format_sql: true
